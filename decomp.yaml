platform: gba

tools:
  transmuter:
    # Shell command template for compiling a candidate source.
    # Use the placeholders `{{inputPath}}`, `{{outputPath}}`, and `{{functionName}}` as needed.
    compiler: |
      # `sh -c` runs this whole template as ONE command, so without `set -e` a compiler
      # error does not fail it: agbcc emits an error-recovery .s anyway, `as` assembles
      # that, the script exits 0, and the caller scores an object built from source the
      # compiler REJECTED. That is where phantom scores come from.
      set -e

      ASM_DIR="$(dirname "{{outputPath}}")"
      BASENAME="$(basename "{{outputPath}}" .o)"
      PRE_FILE="$ASM_DIR/$BASENAME.i"
      ASM_FILE="$ASM_DIR/$BASENAME.s"

      arm-none-eabi-cpp \
        -nostdinc -I tools/agbcc/include -iquote include \
        "{{inputPath}}" -o "$PRE_FILE"

      ./tools/agbcc/bin/agbcc \
        "$PRE_FILE" -o "$ASM_FILE" \
        -mthumb-interwork -Wimplicit -Wparentheses -Werror \
        -O2 -fhex-asm -fprologue-bugfix

      printf ".text\n\t.align\t2, 0\n" >> "$ASM_FILE"

      arm-none-eabi-as -mcpu=arm7tdmi -mthumb-interwork \
        "$ASM_FILE" -o "{{outputPath}}"

  # Used by `asmlift <fn.s> --score-against <target.o>`.
  # NOTE: no -Werror here (unlike transmuter's template) — candidates compile self-contained
  # (asmlift synthesizes declarations for value-referenced globals from the ELF's DWARF), and
  # CALLS rely on C89 implicit declarations, which -Wimplicit would otherwise turn fatal.
  asmlift:
    # the DERIVED elf: a copy of klonoa-eod.elf with the DWARF types-sidecar merged in
    # (build it with `make asmlift-elf`) — asmlift's symbol source
    elf: klonoa-eod-syms.elf
    compiler: |
      # `sh -c` runs this whole template as ONE command, so without `set -e` a compiler
      # error does not fail it: agbcc emits an error-recovery .s anyway, `as` assembles
      # that, the script exits 0, and the caller scores an object built from source the
      # compiler REJECTED. That is where phantom scores come from.
      set -e

      ASM_DIR="$(dirname "{{outputPath}}")"
      BASENAME="$(basename "{{outputPath}}" .o)"
      PRE_FILE="$ASM_DIR/$BASENAME.i"
      ASM_FILE="$ASM_DIR/$BASENAME.s"

      arm-none-eabi-cpp \
        -nostdinc -I tools/agbcc/include -iquote include \
        "{{inputPath}}" -o "$PRE_FILE"

      ./tools/agbcc/bin/agbcc \
        "$PRE_FILE" -o "$ASM_FILE" \
        -mthumb-interwork -Wimplicit -Wparentheses \
        -O2 -fhex-asm -fprologue-bugfix

      printf ".text\n\t.align\t2, 0\n" >> "$ASM_FILE"

      arm-none-eabi-as -mcpu=arm7tdmi -mthumb-interwork \
        "$ASM_FILE" -o "{{outputPath}}"
